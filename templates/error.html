<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .error-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            margin-top: 100px;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
        }

        .error-box h1 {
            color: #dc3545;
        }

        a {
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="error-box">
            <h1>Error</h1>
            <p>{{ message }}</p>
            <a href="{{ url_for('index') }}">Go to Home</a>
        </div>
    </div>
</body>

</html>
