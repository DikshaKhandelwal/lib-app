<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: Arial;
            background: #eef2f5;
            padding: 40px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            margin: auto;
        }

        h2 {
            color: #333;
        }

        .info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }

        a {
            display: inline-block;
            margin: 10px 10px 0 0;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        a:hover {
            background: #0056b3;
        }

        .logout {
            background: #dc3545;
        }

        .logout:hover {
            background: #c82333;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>Member Dashboard</h2>
        <div class="info">
            <p><strong>Username:</strong> {{ user['username'] }}</p>
            <p><strong>Role:</strong> {{ user['role'] }}</p>
        </div>
        <div>
            <a href="{{ url_for('member_books') }}">Browse Books</a>
            <a href="{{ url_for('logout') }}" class="logout">Logout</a>
        </div>
    </div>
</body>

</html>
