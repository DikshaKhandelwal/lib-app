<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
        }

        .card {
            width: 320px;
            margin: 100px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
        }

        input,
        button {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
        }

        button {
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }

        .error {
            color: red;
        }

        a {
            text-align: center;
            display: block;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Register</h2>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="post">
            <input name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <select name="role" required style="width:100%; padding:10px; margin-top:12px;">
                <option value="" disabled selected>Select Role</option>
                <option value="member">Member</option>
                <option value="admin">Admin</option>
            </select>
            <button type="submit">Register</button>
        </form>
        <a href="{{ url_for('login') }}">Already have an account? Login</a>
    </div>
</body>

</html>
